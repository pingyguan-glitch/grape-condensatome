# Railway config — GrapeCondensatome (Node + SQLite)
# From a machine with Railway auth:
#   npx --yes @railway/cli login
#   npx --yes @railway/cli init
#   npx --yes @railway/cli up
# Or: New Project → Deploy from GitHub → select this repo.
# After deploy, paste the Railway public HTTPS URL into docs/HOSTING.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
