# Fly.io — recommended independent host for GrapeCondensatome (NAR Web Server path).
# Anonymous HTTPS :443, no Cursor apps-gate. Exact steps: docs/DEPLOY.md
#
# One-time (YOU — agents cannot mint your Fly account/token):
#   fly auth login && fly apps create grape-condensatome
#   paste FLY_API_TOKEN into GitHub → Settings → Secrets → Actions
#   (workflow .github/workflows/fly-deploy.yml redeploys on main)
# Then paste https://<app>.fly.dev into docs/HOSTING.md + README badges.

app = "grape-condensatome"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm for proposal/demo day (set to 0 + auto_stop to save credits).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
