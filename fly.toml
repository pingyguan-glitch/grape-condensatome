# Fly.io app config for GrapeCondensatome (Node + SQLite).
# One-time (requires `fly auth login` on your machine):
#   fly apps create grape-condensatome
#   fly deploy
# Then paste the https://grape-condensatome.fly.dev URL into docs/HOSTING.md.
#
# app name must match the Fly app you create; change if taken.

app = "grape-condensatome"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
