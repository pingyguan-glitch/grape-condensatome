# Multi-species fruit-tree / fruit-crop condensatome manifest.
# UniProt proteome IDs pinned after live REST lookup (2026-11-27).
# Scores: grape-trained PlantLLPS v13 (composition-proxy disorder) — NOT species-retrained.
#
# status:
#   score   — download FASTA + score + deposit under data/fruit_crops/
#   link    — already deposited elsewhere (soybean/tomato/grape); index only
#   skip    — no usable UniProt reference / near-complete proteome; document failure

version: 1
model: model_formal.json
model_note: >
  Grape-trained PlantLLPS v13 hybrid with composition-proxy disorder.
  Tier cutoffs recalibrated per proteome. Not species-specific retrained weights.
out_dir: data/fruit_crops
honesty: >
  Cross-species transfer of grape-trained PlantLLPS. OrthoDB grape joins are
  eukaryote-level and can be broad. Do not treat ranks as experimental LLPS calls.

species:
  # --- keep existing grape / soybean / tomato joins ---
  - slug: grape
    label: Grape
    species: Vitis vinifera
    taxon: 29760
    proteome: UP000009183
    status: link
    deposit: data/grape_condensatome.sqlite
    odb_key: vvi
    note: Primary atlas (already scored).

  - slug: soybean
    label: Soybean
    species: Glycine max
    taxon: 3847
    proteome: UP000008827
    status: link
    deposit: data/second_crop/soybean_condensatome.sqlite
    odb_key: gma
    gene_prefixes: [GLYMA, Glyma, LOC]

  - slug: tomato
    label: Tomato
    species: Solanum lycopersicum
    taxon: 4081
    proteome: UP000004994
    status: link
    deposit: data/second_crop/tomato_condensatome.sqlite
    odb_key: sly
    gene_prefixes: [Solyc, LOC]

  # --- fruit trees / major fruit crops (score) ---
  - slug: apple
    label: Apple
    species: Malus domestica
    taxon: 3750
    proteome: UP000290289
    status: score
    odb_key: mdo
    gene_prefixes: [MD, LOC]
    note: UniProt reference proteome (cv. HFTH1).

  - slug: pear
    label: Pear
    species: Pyrus ussuriensis x Pyrus communis
    taxon: 2448454
    proteome: UP000327157
    status: score
    odb_key: pyr
    gene_prefixes: [LOC, Pyr]
    note: Closest pear reference; pure Pyrus communis has no UniProt proteome.

  - slug: peach
